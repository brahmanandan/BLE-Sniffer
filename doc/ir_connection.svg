<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>IR wiring — XIAO nRF52840 + M5Stack Unit IR (U002)</title>
<defs><marker id="mea580c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="mea580cs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ea580c"/></marker></defs>
<rect width="980" height="600" fill="#ffffff"/>
<text x="28" y="36" font-size="21" font-weight="700" fill="#0f172a">IR wiring — XIAO nRF52840 + M5Stack Unit IR (U002)</text>
<text x="28" y="60" font-size="13.5" fill="#475569">One 4-wire HY2.0 cable. TX and RX in one unit (38 kHz, 940 nm). Firmware makes the 38 kHz on D1 and decodes on D0.</text>
<rect x="60" y="120" width="220" height="220" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="170.0" y="220.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">XIAO</text>
<text x="170.0" y="239.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">nRF52840</text>
<rect x="660" y="120" width="260" height="220" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
<text x="790.0" y="211.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">M5Stack Unit IR</text>
<text x="790.0" y="230.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">U002 — TX + RX</text>
<text x="790.0" y="248.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">38 kHz / 940 nm</text>
<rect x="272" y="152" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="262" y="160.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="end" dominant-baseline="middle">3V3</text>
<rect x="272" y="197" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="262" y="205.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="end" dominant-baseline="middle">GND</text>
<rect x="272" y="242" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="262" y="250.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="end" dominant-baseline="middle">D0</text>
<rect x="272" y="287" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="262" y="295.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="end" dominant-baseline="middle">D1</text>
<rect x="652" y="152" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="678" y="160.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="middle">GND</text>
<rect x="652" y="197" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="678" y="205.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="middle">5V</text>
<rect x="652" y="242" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="678" y="250.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="middle">IR_TX</text>
<rect x="652" y="287" width="16" height="16" fill="#fff" stroke="#0f172a" stroke-width="1.4"/>
<text x="678" y="295.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start" dominant-baseline="middle">IR_RX</text>
<path d="M288,160 L450,160 L450,205 L652,205" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/>
<path d="M288,205 L400,205 L400,182 L500,182 L500,160 L652,160" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<path d="M288,250 L450,250 L450,295 L652,295" fill="none" stroke="#9ca3af" stroke-width="4" stroke-linejoin="round"/>
<path d="M288,295 L400,295 L400,272 L500,272 L500,250 L652,250" fill="none" stroke="#d97706" stroke-width="4" stroke-linejoin="round"/>
<path d="M920,150 l50,-30" stroke="#ea580c" stroke-width="2.5" marker-end="url(#mea580c)"/>
<text x="955" y="108.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ea580c" text-anchor="middle" dominant-baseline="middle">IR</text>
<rect x="300" y="364" width="26" height="12" rx="2" fill="#dc2626" stroke="#475569" stroke-width="0.8"/>
<text x="336" y="370.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Red: 5V pin → XIAO 3V3</text>
<rect x="300" y="388" width="26" height="12" rx="2" fill="#111827" stroke="#475569" stroke-width="0.8"/>
<text x="336" y="394.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Black: GND → GND</text>
<rect x="300" y="412" width="26" height="12" rx="2" fill="#9ca3af" stroke="#475569" stroke-width="0.8"/>
<text x="336" y="418.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" dominant-baseline="middle">White: IR_RX → D0</text>
<rect x="300" y="436" width="26" height="12" rx="2" fill="#d97706" stroke="#475569" stroke-width="0.8"/>
<text x="336" y="442.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Yellow: IR_TX → D1</text>
<rect x="40" y="470" width="440" height="112" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="52" y="496.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">Power the unit from 3V3, not 5V</text>
<text x="52" y="511.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">The nRF52840 is not 5V-tolerant and IR_RX follows the</text>
<text x="52" y="526.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">supply. 3V3 is also the only rail on battery.</text>
<text x="52" y="541.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">Max range (USB only): 5V on red + a divider on IR_RX</text>
<text x="52" y="555.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">(10 kΩ series, 20 kΩ to GND).</text>
<rect x="500" y="470" width="440" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="512" y="496.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start" dominant-baseline="middle">Pins and mounting</text>
<text x="512" y="511.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">D0 = P0.02 ← IR_RX (demodulated, active low)</text>
<text x="512" y="526.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">D1 = P0.03 → IR_TX (38 kHz PWM carrier, ~33 % duty)</text>
<text x="512" y="541.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">No extra parts: the unit drives its own LED. Solder the</text>
<text x="512" y="555.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">4 wires to the pads; the unit mounts outside the case.</text>
</svg>
