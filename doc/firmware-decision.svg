<text x="175.0" y="731.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">Keys · Voice · IR · Test tabs</text>
<text x="175.0" y="747.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">GATT, Remote info, battery, log</text>
<text x="175.0" y="762.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">Export report.json / .html</text>
<text x="175.0" y="778.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">(Ch. 6, 8)</text>
<polygon points="820,282.0 970.0,342 820,402.0 670.0,342" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="820" y="325.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Watch a real remote ⇄ STB</text>
<text x="820" y="342.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">link without pairing</text>
<text x="820" y="358.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">the remote to anything?</text>
