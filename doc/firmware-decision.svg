<text x="840" y="425.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle" dominant-baseline="middle">yes</text>
<path d="M670,342 L612,342 L612,470" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="628.3" y="320.2" width="23.4" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="640" y="330.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="530" y="470" width="165" height="92" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="612.5" y="492.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Neither image</text>
<text x="612.5" y="508.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">fits: see</text>
<text x="612.5" y="523.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Troubleshooting</text>
<text x="612.5" y="539.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">(Ch. 10)</text>
<rect x="720" y="450" width="220" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="830.0" y="479.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle" dominant-baseline="middle">Nordic nRF Sniffer</text>
<text x="830.0" y="496.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#78350f" text-anchor="middle" dominant-baseline="middle">+ Wireshark extcap</text>
<text x="830.0" y="512.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#78350f" text-anchor="middle" dominant-baseline="middle">(not the web app)</text>
<path d="M830,542 L830,580" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="710" y="580" width="240" height="96" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="830.0" y="604.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle" dominant-baseline="middle">Flash it</text>
<text x="830.0" y="620.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350f" text-anchor="middle" dominant-baseline="middle">flash.py sniffer, or app:</text>
<text x="830.0" y="635.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350f" text-anchor="middle" dominant-baseline="middle">Connect ▸ Firmware ▸</text>
<text x="830.0" y="651.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#78350f" text-anchor="middle" dominant-baseline="middle">Flash Nordic sniffer</text>
<path d="M830,676 L830,712" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<rect x="700" y="712" width="260" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="830.0" y="737.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Capture in Wireshark (Ch. 9)</text>
<text x="830.0" y="753.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Encrypted after bonding:</text>
<text x="830.0" y="768.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">keys only readable via the jig.</text>
<text x="830.0" y="784.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155" text-anchor="middle" dominant-baseline="middle">Flash xiao-test-tool back after.</text>
<rect x="380" y="712" width="280" height="98" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="520.0" y="744.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Need both at the same time?</text>
<text x="520.0" y="761.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Use a second XIAO that</text>
<text x="520.0" y="777.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">stays on the sniffer image.</text>
