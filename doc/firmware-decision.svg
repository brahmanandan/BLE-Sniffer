<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<title>Which firmware for which job?</title>
<defs><marker id="m475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m475569s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker><marker id="m15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m15803ds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#15803d"/></marker><marker id="mb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="mb91c1cs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#b91c1c"/></marker></defs>
<rect width="1000" height="860" fill="#ffffff"/>
<text x="28" y="36" font-size="21" font-weight="700" fill="#0f172a">Which firmware for which job?</text>
<text x="28" y="60" font-size="13.5" fill="#475569">Only one image runs at a time. Switching takes ~20 s (Ch. 4). For both roles at once, use a second XIAO.</text>
<rect x="370" y="82" width="260" height="46" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="500.0" y="105.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">What do you want to do?</text>
<path d="M500,128 L500,160" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<polygon points="500,160.0 715.0,225 500,290.0 285.0,225" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="500" y="200.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Read key presses, record voice,</text>
<text x="500" y="216.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">read battery / GATT / device info,</text>
<text x="500" y="233.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">send or learn IR, or run a</text>
<text x="500" y="249.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">pass/fail test on a remote?</text>
<path d="M285,225 L180,225 L180,282" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#m15803d)"/>
<rect x="214.9" y="203.2" width="30.2" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="230" y="213.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle" dominant-baseline="middle">yes</text>
<path d="M715,225 L820,225 L820,282" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#mb91c1c)"/>
<rect x="753.3" y="203.2" width="23.4" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="765" y="213.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="60" y="282" width="240" height="86" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="180.0" y="307.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">xiao-test-tool</text>
<text x="180.0" y="325.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">BLE central + IR + battery</text>
<text x="180.0" y="342.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">→ use the web app</text>
<path d="M180,368 L180,400" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
<polygon points="180,403.0 305.0,455 180,507.0 55.0,455" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="180" y="446.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Banner shows</text>
<text x="180" y="463.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">“jig online”?</text>
<path d="M180,507 L180,560" fill="none" stroke="#15803d" stroke-width="1.6" marker-end="url(#m15803d)"/>
