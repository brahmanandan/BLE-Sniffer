<text x="198" y="532.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle" dominant-baseline="middle">yes</text>
<path d="M305,455 L360,455 L360,560" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#mb91c1c)"/>
<rect x="318.3" y="433.2" width="23.4" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/>
<text x="330" y="443.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle">no</text>
<rect x="290" y="560" width="160" height="104" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="370.0" y="582.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">Flash it</text>
<text x="370.0" y="597.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">app: Flash</text>
<text x="370.0" y="612.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">xiao-test-tool</text>
<text x="370.0" y="627.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">or flash.py tool</text>
<text x="370.0" y="641.9" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle">(double-tap RST)</text>
<rect x="60" y="560" width="210" height="104" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
<text x="165.0" y="588.6" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle" dominant-baseline="middle">Pair the remote</text>
<text x="165.0" y="604.2" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">STB off · pairing mode</text>
<text x="165.0" y="619.8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">Connect ▸ Scan ▸</text>
<text x="165.0" y="635.4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#14532d" text-anchor="middle" dominant-baseline="middle">Connect ▸ Bond (Ch. 7)</text>
<path d="M290,612 L270,612" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#m475569)"/>
